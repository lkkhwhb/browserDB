<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrowserDB Benchmark</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 800px; margin: 40px auto; padding: 20px; }
        h1 { color: #1a1c28; }
        button { padding: 10px 20px; font-size: 16px; background: #4f6df5; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background: #3a56d4; }
        #results { margin-top: 20px; font-family: monospace; white-space: pre-wrap; background: #f5f6fa; padding: 20px; border-radius: 8px; border: 1px solid #e2e4ee; }
    </style>
    <script src="../dist/browserdb.global.js"></script>
</head>
<body>

    <h1>BrowserDB vs localStorage Benchmark</h1>
    <p>This benchmark measures the speed and storage footprint of saving 1,000 documents.</p>
    
    <button onclick="runBenchmark()">Run Benchmark</button>
    <div id="results">Waiting to run...</div>

    <script>
        const resultsEl = document.getElementById('results');
        function log(msg) {
            resultsEl.textContent += msg + '\n';
        }

        async function runBenchmark() {
            resultsEl.textContent = 'Running benchmark...\n\n';
            
            // Generate mock data (1000 objects)
            const payload = Array.from({ length: 1000 }).map((_, i) => ({
                _id: `id_${i}`,
                name: `User ${i}`,
                email: `user${i}@example.com`,
                role: i % 2 === 0 ? "admin" : "user",
                createdAt: new Date().toISOString()
            }));

            // --- 1. Raw localStorage ---
            log("--- 1. Raw localStorage (Sync) ---");
            localStorage.clear();
            const startRaw = performance.now();
            
            // Native localStorage requires manual JSON.stringify array
            const rawString = JSON.stringify(payload);
            localStorage.setItem('raw_users', rawString);
            
            const endRaw = performance.now();
            const rawTime = (endRaw - startRaw).toFixed(2);
            
            // Calculate raw size
            const rawSize = new TextEncoder().encode(rawString).length;
            log(`Time taken: ${rawTime} ms`);
            log(`Storage Size: ${(rawSize / 1024).toFixed(2)} KB`);
            
            // --- 2. BrowserDB ---
            log("\n--- 2. BrowserDB (Async + Compression) ---");
            const db = new window.BrowserDB.LocalDB();
            await db.clear(); // Clear all
            
            const users = db.collection("users");
            
            const startDb = performance.now();
            await users.insertMany(payload);
            const endDb = performance.now();
            
            const dbTime = (endDb - startDb).toFixed(2);
            const stats = await db.stats();
            
            log(`Time taken: ${dbTime} ms`);
            log(`Storage Size: ${stats.usedKB} (Compressed)`);
            
            // --- Summary ---
            log("\n--- Summary ---");
            log(`BrowserDB is ${(rawSize / stats.usedBytes).toFixed(2)}x more space-efficient.`);
            log(`Note: BrowserDB traded ~${(dbTime - rawTime).toFixed(2)}ms of background CPU time for compression, keeping the UI unblocked!`);
        }
    </script>
</body>
</html>
